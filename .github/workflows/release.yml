name: Release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release (es. 1.1.0)"
        required: true

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - name: Allinea la versione del manifest al tag
        run: |
          VERSION="${TAG#v}"
          F=custom_components/local_meteo/manifest.json
          jq --arg v "$VERSION" '.version = $v' "$F" > manifest.tmp
          mv manifest.tmp "$F"

      - name: Crea local_meteo.zip
        run: |
          cd custom_components/local_meteo
          zip -r ../../local_meteo.zip . -x "*.pyc" "__pycache__/*"

      - name: Controlla lo zip
        run: unzip -l local_meteo.zip | head -20

      - name: Carica local_meteo.zip nella release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Tag: $TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets
          gh release upload "$TAG" local_meteo.zip --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
